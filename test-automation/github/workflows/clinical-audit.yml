name: Platinum Clinical Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web_and_security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run Selenium Web Tests
        run: pytest tests/selenium/ --html=reports/web_report.html
        
      - name: Run Vulnerability Scan
        run: pytest tests/vulnerability/ --html=reports/security_report.html
        
      - name: Upload Web/Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: web-security-reports
          path: reports/

  load_testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 Load Suite
        uses: grafana/setup-k6-action@v1
      - run: k6 run tests/load/k6_load_suite.js --summary-export=reports/load_summary.json
      
      - name: Upload Load Report
        uses: actions/upload-artifact@v4
        with:
          name: load-performance-report
          path: reports/

  mobile_audit:
    runs-on: macos-latest # Required for Android Emulator acceleration
    steps:
      - uses: actions/checkout@v4
      - name: Set up Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          
      - name: Run Appium Suite
        run: |
          appium & # Start server in background
          pytest tests/appium/ --html=reports/mobile_report.html
          
      - name: Upload Mobile Report
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit-report
          path: reports/
