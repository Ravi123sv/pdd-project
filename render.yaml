services:
  - type: web
    name: neurosignal-clinical-hub
    env: node
    plan: free
    # Remove rootDir to ensure the whole repo is available if needed
    # But cd into the backend for commands
    buildCommand: "cd pdd-website/backend/express-server && npm install"
    startCommand: "cd pdd-website/backend/express-server && node index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NEXT_PUBLIC_GEMINI_API_KEY
        sync: false
      - key: ENABLE_NEURAL_UPLINK
        value: "false"
      - key: JWT_SECRET
        value: neurosignal_clinical_secret_key_2026
