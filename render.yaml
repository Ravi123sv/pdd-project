services:
  - type: web
    name: neurosignal-clinical-hub
    env: node
    plan: free
    # Force the root directory to the backend so commands are relative to it
    rootDir: pdd-website/backend/express-server
    buildCommand: "npm install"
    startCommand: "node index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NEXT_PUBLIC_GEMINI_API_KEY
        sync: false
      - key: ENABLE_NEURAL_UPLINK
        value: "false"
      - key: JWT_SECRET
        value: neurosignal_clinical_secret_key_2026
